- name: Create Nextcloud container
  containers.podman.podman_container:
    image: "{{ nextcloud_image }}"
    image_strict: true
    recreate: false
    state: started
    name: "nextcloud"
    network:
      - nextcloud_network
    env:
      MYSQL_DATABASE: "nextcloud_db"
      MYSQL_USER: "nextcloud"
      MYSQL_PASSWORD: "{{ mysql_password }}"
      MYSQL_HOST: "{{ mysql_host }}"
      NEXTCLOUD_ADMIN_USER: "nextcloudadm"
      NEXTCLOUD_ADMIN_PASSWORD: "{{ nextcloud_admin_password }}"
      NEXTCLOUD_TRUSTED_DOMAINS: "{{ nextcloud_trusted_domains }}"
      SMTP_HOST: "{{ smtp_host }}"
      SMTP_SECURE: "{{ smtp_secure }}"
      SMTP_PORT: "{{ smtp_port }}"
      SMTP_AUTHTYPE: "{{ smtp_authtype }}"
      SMTP_NAME: "{{ smtp_name }}"
      SMTP_PASSWORD: "{{ smtp_password }}"
      MAIL_FROM_ADDRESS: "{{ mail_from_address }}"
      MAIL_DOMAIN: "{{ mail_domain }}"
      OVERWRITEPROTOCOL: "{{ nextcloud_overwriteprotocol }}"
      OVERWRITECLIURL: "{{ nextcloud_overwritecliurl }}"
    volumes:
      - "{{ nextcloud_data_dir }}/appdata/html:/var/www/html:Z"
      - "{{ nextcloud_data_dir }}/appdata/app:/var/www/html/custom_apps:Z"
      - "{{ nextcloud_data_dir }}/appdata/config:/var/www/html/config:Z"
      - "{{ nextcloud_data_dir }}/data:/var/www/html/data:Z"
      - "/var/run/podman/podman.sock:/var/run/docker.sock:ro,z"
      - "/etc/localtime:/etc/localtime"
    labels:
      traefik.http.routers.nextcloud.rule: Host(`{{ nextcloud_url }}`)"
    generate_systemd:
      path: "/etc/containers/systemd/"
      restart_policy: always
      after:
        - container-nextcloud_mariadb.service
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  become_user: root

- name: Nextcloud container must be started and enabled on systemd
  ansible.builtin.systemd:
    name: container-nextcloud
    daemon_reload: true
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root
