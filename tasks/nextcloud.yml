- name: Create Nextcloud container
  containers.podman.podman_container:
    image: "{{ nextcloud_image }}"
    image_strict: true
    recreate: true
    state: started
    name: "nextcloud"
    network:
      - nextcloud_network
    uidmap:
      - "0:33:33"
    gidmap:
      - "0:33:33"
    env:
      MYSQL_DATABASE: "nextcloud_db"
      MYSQL_USER: "nextcloud"
      MYSQL_PASSWORD: "{{ mysql_password }}"
      MYSQL_HOST: "{{ mysql_host }}"
      NEXTCLOUD_ADMIN_USER: "nextcloudadm"
      NEXTCLOUD_ADMIN_PASSWORD: "{{ nextcloud_admin_password }}"
      NEXTCLOUD_TRUSTED_DOMAINS: "{{ nextcloud_trusted_domains }}"
      SMTP_HOST: "{{ smtp_host }}"
      SMTP_SECURE: "{{ smtp_secure }}"
      SMTP_PORT: "{{ smtp_port }}"
      SMTP_AUTHTYPE: "{{ smtp_authtype }}"
      SMTP_NAME: "{{ smtp_name }}"
      SMTP_PASSWORD: "{{ smtp_password }}"
      MAIL_FROM_ADDRESS: "{{ mail_from_address }}"
      MAIL_DOMAIN: "{{ mail_domain }}"
      OVERWRITEPROTOCOL: "{{ nextcloud_overwriteprotocol }}"
      OVERWRITECLIURL: "{{ nextcloud_overwritecliurl }}"
      PUID: "33"
      PGID: "33"
    volumes:
      - "{{ nextcloud_data_dir }}/appdata/html:/var/www/html:Z"
      - "{{ nextcloud_data_dir }}/appdata/app:/var/www/html/custom_apps:Z"
      - "{{ nextcloud_data_dir }}/appdata/config:/var/www/html/config:Z"
      - "{{ nextcloud_data_dir }}/data:/var/www/html/data:Z"
      - "/var/run/podman/podman.sock:/var/run/docker.sock:ro,z"
      - "/etc/localtime:/etc/localtime"
    labels:
      traefik.enable: true
      traefik.http.services.nextcloud.loadbalancer.server.port: "80" # update to actual port
      traefik.http.routers.nextcloud-https.rule: Host(`nextcloud.riz-rpi-001.riz.internal`)
      traefik.http.routers.nextcloud-https.entrypoints: https
      traefik.http.routers.nextcloud-https.tls: true
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root
