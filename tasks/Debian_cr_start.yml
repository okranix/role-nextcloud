- name: Ensure prerquisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
  become: true
  become_user: root

- name: Get docker repository GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker_key.gpg_armored
    checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570 # curl -sL https://download.docker.com/linux/ubuntu/gpg|sha256sum
    mode: "0644"
    owner: root
    group: root
    force: true
  become: true
  become_user: root

- name: De-Armor docker GPG key
  ansible.builtin.shell: "gpg --dearmor < /usr/share/keyrings/docker_key.gpg_armored > /usr/share/keyrings/docker_key.gpg"
  args:
    creates: /usr/share/keyrings/docker_key.gpg
  no_log: true
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris: https://download.docker.com/linux/debian
    architectures:
      - arm64
    components:
      - stable
    suites:
      - "{{ ansible_distribution_release }}"
    signed_by: /usr/share/keyrings/docker_key.gpg
    state: present
    enabled: true
  become: true
  become_user: root

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root
