- name: "Copy traefik main configuration file"
  ansible.builtin.copy:
    src: "traefik.yml"
    dest: "/root/traefik/traefik.yml"
    mode: "0640"
  register: "traefik_base_config"

- name: Create traefik container
  containers.podman.podman_container:
    name: traefik
    conmon_pidfile: "/tmp/traefik_conmon.pid"
    image: "{{ traefik_image }}"
    image_strict: true
    recreate: true
    state: started
    user: "{{ podman_user_uid }}"
    userns: keep-id
    network:
      - nextcloud_network
    publish:
      - "80:80"
      - "443:443"
    volume:
      - "/root/traefik/traefik.yml:/traefik.yml:ro,Z"
      - "/root/traefik:/config:ro,Z"
      - "/var/run/podman/podman.sock:/var/run/docker.sock:ro,z"
      - "/etc/localtime:/etc/localtime"
    security_opt:
      - "label:type:container_runtime_t"
    generate_systemd:
      path: "/etc/containers/systemd/"
      restart_policy: always
  register: "traefik_creation"
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  become_user: root

- name: Traefik container must be started and enabled on systemd
  ansible.builtin.systemd:
    name: container-traefik
    daemon_reload: true
    state: started
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root

- name: Configure iptables for published ports
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_ports:
      - "80"
      - "443"
      - "8080"
    jump: ACCEPT
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: root

- name: "Restart traefik if config changed and container was not newly created"
  ansible.builtin.assert:
    that: true
    quiet: true
  changed_when: true
  when:
    - traefik_creation is not changed
    - traefik_base_config is changed
  notify: "Podman: Restart traefik"
