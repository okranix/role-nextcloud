- name: Ensure appdata directory for nextcloud HTML
  ansible.builtin.file:
    path: "{{ nextcloud_data_dir }}/appdata/html"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  become_user: root

- name: Ensure appdata directory for nextcloud apps
  ansible.builtin.file:
    path: "{{ nextcloud_data_dir }}/appdata/app"
